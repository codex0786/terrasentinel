[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terrasentinel"
version = "0.1.0"
description = "Research-grade, uncertainty-aware satellite hazard intelligence for India"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6",
    "requests>=2.31",
    "tabulate>=0.9",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
geo = ["geopandas>=1.0", "shapely>=2.0", "pyproj>=3.6", "pyogrio>=0.7"]
earthdata = ["earthaccess>=0.10", "xarray>=2024.1"]
dashboard = ["streamlit>=1.38", "pydeck>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
markers = [
    "network: test performs a live request to an external service (skipped by default)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
